name: Sensor switch
products:
  - id: oj6soirdngp9jijy
    manufacturer: Tongou
    model: TOVTH-216WTTDA
entities:
  - entity: sensor
    class: temperature
    dps:
      - id: 27
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    class: humidity
    dps:
      - id: 46
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "1"
    dps:
      - id: 2
        type: boolean
        name: switch
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "2"
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: switch
    name: Auto mode 1
    category: config
    icon: "mdi:auto-mode"
    dps:
      - id: 104
        type: boolean
        name: switch
  - entity: switch
    name: Auto mode 2
    category: config
    icon: "mdi:auto-mode"
    dps:
      - id: 105
        type: boolean
        name: switch
  - entity: select
    name: Control source 1
    category: config
    icon: "mdi:thermometer-water"
    dps:
      - id: 107
        type: string
        name: option
        mapping:
          - dps_val: temperature
            value: Temperature
          - dps_val: humidity
            value: Humidity
  - entity: select
    name: Control source 2
    category: config
    icon: "mdi:thermometer-water"
    dps:
      - id: 108
        type: string
        name: option
        mapping:
          - dps_val: temperature
            value: Temperature
          - dps_val: humidity
            value: Humidity
  - entity: select
    translation_key: initial_state
    category: config
    dps:
      - id: 106
        type: string
        name: option
        mapping:
          - dps_val: "on"
            value: "on"
          - dps_val: "off"
            value: "off"
          - dps_val: memory
            value: memory
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 20
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: sensor
    name: Control mode
    class: enum
    category: diagnostic
    icon: "mdi:remote"
    dps:
      - id: 121
        type: string
        name: sensor
        mapping:
          - dps_val: Local_Lock
            value: Locked
          - dps_val: Local_Mode
            value: Local only
          - dps_val: Remote_Mode
            value: Remote only
          - dps_val: Full_Control
            value: Local and remote
  - entity: sensor
    name: Event
    class: enum
    category: diagnostic
    icon: "mdi:alert-outline"
    dps:
      - id: 118
        type: string
        name: sensor
        mapping:
          - dps_val: Normal
            value: Normal
          - dps_val: S1_high_temp_alarm
            value: Switch 1 high temperature
          - dps_val: S1_low_temp_alarm
            value: Switch 1 low temperature
          - dps_val: S1_high_humid_alarm
            value: Switch 1 high humidity
          - dps_val: S1_low_humid_alarm
            value: Switch 1 low humidity
          - dps_val: S2_high_temp_alarm
            value: Switch 2 high temperature
          - dps_val: S2_low_temp_alarm
            value: Switch 2 low temperature
          - dps_val: S2_high_humid_alarm
            value: Switch 2 high humidity
          - dps_val: S2_low_humid_alarm
            value: Switch 2 low humidity
          - dps_val: Local_Lock
            value: Locked
          - dps_val: Local_Mode
            value: Local only
          - dps_val: Remote_Mode
            value: Remote only
          - dps_val: Full_Control
            value: Local and remote
  - entity: sensor
    name: Cycle time
    category: diagnostic
    icon: "mdi:timer-cog-outline"
    dps:
      - id: 7
        type: string
        name: sensor
  - entity: switch
    name: Probe
    category: config
    icon: "mdi:thermometer-probe"
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: number
    translation_key: temperature_calibration
    category: config
    dps:
      - id: 30
        type: integer
        name: value
        unit: C
        range:
          min: -9
          max: 9
  - entity: number
    name: Humidity calibration
    category: config
    icon: "mdi:water-percent"
    dps:
      - id: 47
        type: integer
        name: value
        unit: "%"
        range:
          min: -9
          max: 9
  - entity: number
    name: Sw 1 min temp
    class: temperature
    category: config
    dps:
      - id: 22
        type: integer
        name: value
        unit: C
        range:
          min: -25
          max: 100
  - entity: number
    name: Sw 1 min humidity
    class: humidity
    category: config
    dps:
      - id: 41
        type: integer
        name: value
        unit: "%"
        range:
          min: 1
          max: 99
  - entity: number
    name: Sw 1 max temp
    class: temperature
    category: config
    dps:
      - id: 110
        type: integer
        name: value
        unit: C
        range:
          min: -25
          max: 100
  - entity: number
    name: Sw 1 max humidity
    class: humidity
    category: config
    dps:
      - id: 111
        type: integer
        name: value
        unit: "%"
        range:
          min: 1
          max: 99
  - entity: number
    name: Sw 2 min temp
    class: temperature
    category: config
    dps:
      - id: 113
        type: integer
        name: value
        unit: C
        range:
          min: -25
          max: 100
  - entity: number
    name: Sw 2 min humidity
    class: humidity
    category: config
    dps:
      - id: 116
        type: integer
        name: value
        unit: "%"
        range:
          min: 1
          max: 99
  - entity: number
    name: Sw 2 max temp
    class: temperature
    category: config
    dps:
      - id: 115
        type: integer
        name: value
        unit: C
        range:
          min: -25
          max: 100
  - entity: number
    name: Sw 2 max humidity
    class: humidity
    category: config
    dps:
      - id: 117
        type: integer
        name: value
        unit: "%"
        range:
          min: 1
          max: 99
  - entity: switch
    name: Sw 1 low temp relay
    category: config
    icon: "mdi:thermometer-low"
    dps:
      - id: 122
        type: boolean
        name: switch
  - entity: switch
    name: Sw 1 high temp relay
    category: config
    icon: "mdi:thermometer-high"
    dps:
      - id: 123
        type: boolean
        name: switch
  - entity: switch
    name: Sw 1 low humidity relay
    category: config
    icon: "mdi:water-percent"
    dps:
      - id: 124
        type: boolean
        name: switch
  - entity: switch
    name: Sw 1 high humidity relay
    category: config
    icon: "mdi:water-percent"
    dps:
      - id: 125
        type: boolean
        name: switch
  - entity: switch
    name: Sw 2 low temp relay
    category: config
    icon: "mdi:thermometer-low"
    dps:
      - id: 126
        type: boolean
        name: switch
  - entity: switch
    name: Sw 2 high temp relay
    category: config
    icon: "mdi:thermometer-high"
    dps:
      - id: 127
        type: boolean
        name: switch
  - entity: switch
    name: Sw 2 low humidity relay
    category: config
    icon: "mdi:water-percent"
    dps:
      - id: 128
        type: boolean
        name: switch
  - entity: switch
    name: Sw 2 high humidity relay
    category: config
    icon: "mdi:water-percent"
    dps:
      - id: 129
        type: boolean
        name: switch
